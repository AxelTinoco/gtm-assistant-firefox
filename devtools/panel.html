<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0f;
        color: #e8e8f0;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .toolbar {
        background: #111118;
        border-bottom: 1px solid #2a2a3a;
        padding: 8px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .toolbar h1 {
        font-family: 'Syne', sans-serif;
        font-size: 13px;
        font-weight: 800;
        color: #4285f4;
      }
      .toolbar button {
        background: #1a1a25;
        border: 1px solid #2a2a3a;
        color: #e8e8f0;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        font-family: 'JetBrains Mono', monospace;
      }
      .toolbar button:hover {
        border-color: #4285f4;
      }
      .toolbar button[aria-busy='true'] {
        opacity: 0.7;
        cursor: progress;
      }

      .persist-switch {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        user-select: none;
        font-size: 11px;
        font-family: 'JetBrains Mono', monospace;
      }
      .persist-switch .ps-track {
        width: 32px;
        height: 17px;
        border-radius: 999px;
        background: #1a1a25;
        border: 1px solid #2a2a3a;
        position: relative;
        transition:
          background 0.2s,
          border-color 0.2s;
        flex: none;
      }
      .persist-switch .ps-thumb {
        position: absolute;
        top: 1px;
        left: 1px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #8a8ac0;
        transition:
          left 0.2s,
          background 0.2s;
      }
      .persist-switch[aria-checked='true'] .ps-track {
        background: rgba(66, 133, 244, 0.25);
        border-color: #4285f4;
      }
      .persist-switch[aria-checked='true'] .ps-thumb {
        left: 16px;
        background: #4285f4;
      }
      .persist-switch .ps-label {
        color: #e8e8f0;
      }
      .persist-switch[aria-checked='true'] .ps-label {
        color: #4285f4;
      }

      .status-text {
        color: #8a8ac0;
        font-size: 10px;
        margin-left: auto;
      }

      .main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .sidebar {
        width: 240px;
        border-right: 1px solid #2a2a3a;
        overflow-y: auto;
        padding: 10px;
      }

      .sidebar-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 600;
        color: #8a8ac0;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 6px;
        margin-top: 10px;
      }

      .sidebar-label:first-child {
        margin-top: 0;
      }

      .tag-item {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 7px 10px;
        border-radius: 5px;
        cursor: pointer;
        border: 1px solid transparent;
        margin-bottom: 3px;
        transition: all 0.15s;
      }
      .tag-item:hover,
      .tag-item.active,
      .tag-item[aria-current='true'] {
        background: #1a1a25;
        border-color: #2a2a3a;
      }
      .tag-item .tid {
        font-weight: 700;
        font-size: 11px;
      }
      .tag-item .tid.gtm {
        color: #4285f4;
      }
      .tag-item .tid.ga4 {
        color: #34a853;
      }
      .tag-item .tid.muted {
        color: #8a8ac0;
      }
      .tag-item .tsub {
        font-size: 9px;
        color: #8a8ac0;
        margin-top: 1px;
      }

      .detail {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
      }

      .detail-title {
        font-family: 'Syne', sans-serif;
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .detail-title.subhead {
        font-size: 13px;
        margin-top: 16px;
      }

      .dl-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
      }

      .dl-table th {
        background: #111118;
        padding: 7px 10px;
        text-align: left;
        color: #8a8ac0;
        font-size: 10px;
        letter-spacing: 0.5px;
        border-bottom: 1px solid #2a2a3a;
      }

      .dl-table td {
        padding: 6px 10px;
        border-bottom: 1px solid #1a1a25;
        vertical-align: top;
      }

      .dl-table tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }

      .dl-table .event-cell {
        color: #4285f4;
        font-weight: 600;
      }
      .dl-table .json-cell {
        color: #8a8ac0;
        max-width: 400px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .empty {
        padding: 40px;
        text-align: center;
        color: #8a8ac0;
      }

      .empty.sidebar-empty {
        padding: 20px 0;
        text-align: left;
      }

      :focus-visible {
        outline: 2px solid #4285f4;
        outline-offset: 2px;
        border-radius: 4px;
      }
      .toolbar button:focus-visible {
        outline-color: #fff;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <h1><span aria-hidden="true">🏷️</span> GTM &amp; GA4 ASSISTANT</h1>
      <button id="refreshBtn" type="button" aria-label="Refrescar análisis">
        <span aria-hidden="true">↻</span> Refrescar
      </button>
      <div
        id="persistSwitch"
        class="persist-switch"
        role="switch"
        aria-checked="false"
        tabindex="0"
        aria-label="Conservar datos capturados al recargar la página"
        title="Conserva los hits capturados aunque se recargue la página"
      >
        <span class="ps-track" aria-hidden="true"><span class="ps-thumb"></span></span>
        <span class="ps-label">Conservar al recargar</span>
      </div>
      <span
        id="statusText"
        class="status-text"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></span>
    </header>
    <main class="main">
      <nav class="sidebar" id="sidebar" aria-label="Tags detectados">
        <div class="empty">Cargando...</div>
      </nav>
      <section
        class="detail"
        id="detail"
        aria-label="Detalles del tag"
        aria-live="polite"
        aria-atomic="false"
      >
        <div class="empty">← Selecciona un tag para ver detalles</div>
      </section>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
