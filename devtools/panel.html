<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0f;
        color: #e8e8f0;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .toolbar {
        background: #111118;
        border-bottom: 1px solid #2a2a3a;
        padding: 8px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .toolbar h2 {
        font-family: 'Syne', sans-serif;
        font-size: 13px;
        font-weight: 800;
        color: #4285f4;
      }
      .toolbar button {
        background: #1a1a25;
        border: 1px solid #2a2a3a;
        color: #e8e8f0;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        font-family: 'JetBrains Mono', monospace;
      }
      .toolbar button:hover {
        border-color: #4285f4;
      }

      .main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .sidebar {
        width: 240px;
        border-right: 1px solid #2a2a3a;
        overflow-y: auto;
        padding: 10px;
      }

      .sidebar-label {
        font-size: 10px;
        color: #7070a0;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 6px;
        margin-top: 10px;
      }

      .sidebar-label:first-child {
        margin-top: 0;
      }

      .tag-item {
        padding: 7px 10px;
        border-radius: 5px;
        cursor: pointer;
        border: 1px solid transparent;
        margin-bottom: 3px;
        transition: all 0.15s;
      }
      .tag-item:hover,
      .tag-item.active {
        background: #1a1a25;
        border-color: #2a2a3a;
      }
      .tag-item .tid {
        font-weight: 700;
        font-size: 11px;
      }
      .tag-item .tid.gtm {
        color: #4285f4;
      }
      .tag-item .tid.ga4 {
        color: #34a853;
      }
      .tag-item .tsub {
        font-size: 9px;
        color: #7070a0;
        margin-top: 1px;
      }

      .detail {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
      }

      .detail-title {
        font-family: 'Syne', sans-serif;
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dl-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
      }

      .dl-table th {
        background: #111118;
        padding: 7px 10px;
        text-align: left;
        color: #7070a0;
        font-size: 10px;
        letter-spacing: 0.5px;
        border-bottom: 1px solid #2a2a3a;
      }

      .dl-table td {
        padding: 6px 10px;
        border-bottom: 1px solid #1a1a25;
        vertical-align: top;
      }

      .dl-table tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }

      .dl-table .event-cell {
        color: #4285f4;
        font-weight: 600;
      }
      .dl-table .json-cell {
        color: #7070a0;
        max-width: 400px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .empty {
        padding: 40px;
        text-align: center;
        color: #7070a0;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <h2>🏷️ GTM & GA4 ASSISTANT</h2>
      <button id="refreshBtn">↻ Refrescar</button>
      <span id="statusText" style="color: #7070a0; font-size: 10px; margin-left: auto"></span>
    </div>
    <div class="main">
      <div class="sidebar" id="sidebar">
        <div class="empty">Cargando...</div>
      </div>
      <div class="detail" id="detail">
        <div class="empty">← Selecciona un tag para ver detalles</div>
      </div>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
