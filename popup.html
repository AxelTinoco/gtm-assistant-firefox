<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTM & QA Assistant</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #7c5cfc;
        --accent-dark: #5b3ed9;
        --accent-dim: #7c5cfc33;
        /* Lighter accent for text-on-dark — #7C5CFC on #2B3035 is 4.4:1 (fails AA at small sizes).
           #B5A5FF clears 4.5:1 on bg-secondary AND on accent-dim composites. */
        --accent-text: #b5a5ff;
        --bg-primary: #212529;
        --bg-secondary: #2b3035;
        --bg-surface: #3d4349;
        --border: #495057;
        --text-primary: #f8f9fa;
        /* Raised from #ADB5BD (4.2:1) to meet AA on --bg-primary */
        --text-secondary: #c0c7ce;
        /* Decorative only (icons, borders) — keep original tone */
        --text-muted: #6c757d;
        /* Text use — #6C757D fails AA (3.3:1 on --bg-primary) */
        --text-muted-ui: #909aa3;
        --status-success: #34d399;
        --status-error: #f87171;
        --status-warning: #fbbf24;
        --status-info: #60a5fa;
        --radius-lg: 14px;
        --radius-md: 10px;
        --radius-sm: 6px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 340px;
        height: 540px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Accent line */
      .accent-line {
        height: 2px;
        background: linear-gradient(90deg, var(--accent) 0%, #00d4aa 100%);
        flex-shrink: 0;
      }

      /* Header */
      .header {
        background: var(--bg-secondary);
        padding: 14px 16px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .header-icon {
        width: 28px;
        height: 28px;
        background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .header-icon span {
        color: #fff;
        font-size: 10px;
        font-weight: 800;
      }

      .header-titles {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .header-titles h1 {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: var(--text-primary);
        line-height: 1;
      }

      .header-version {
        font-size: 10px;
        font-weight: 400;
        color: var(--text-muted-ui);
        letter-spacing: 0.3px;
      }

      .header-status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--status-success);
        flex-shrink: 0;
        animation: pulse 2s ease-in-out infinite;
      }

      /* Dividers */
      .divider {
        height: 1px;
        background: var(--border);
        flex-shrink: 0;
      }

      /* URL bar */
      .url-bar {
        background: var(--bg-secondary);
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .url-icon {
        color: var(--text-muted);
        flex-shrink: 0;
        display: flex;
        align-items: center;
      }

      .url-text {
        font-size: 10px;
        font-weight: 400;
        color: var(--text-secondary);
        letter-spacing: 0.1px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }

      /* Tab segment */
      .tab-container {
        background: var(--bg-secondary);
        padding: 8px 16px;
        flex-shrink: 0;
      }

      .tab-segment {
        background: rgba(43, 48, 53, 0.6);
        border-radius: 8px;
        padding: 3px;
        display: flex;
        gap: 2px;
      }

      .tab {
        flex: 1;
        padding: 7px 0;
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted-ui);
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        user-select: none;
        /* button reset */
        background: none;
        border: none;
        font-family: 'Inter', sans-serif;
      }

      .tab.active {
        background: var(--accent);
        color: #fff;
      }

      .tab .badge {
        border-radius: 3px;
        padding: 1px 4px;
        font-size: 9px;
        min-width: 16px;
        text-align: center;
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
      }

      .tab:not(.active) .badge {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-muted-ui);
      }

      /* Content */
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 16px 16px 12px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      /* Tab panels — visibility controlled via the hidden attribute + .active class */
      .tab-panel {
        display: block;
      }
      .tab-panel[hidden] {
        display: none;
      }

      /* Status Banner */
      .status-banner {
        border-radius: var(--radius-md);
        padding: 10px 12px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
      }

      .status-banner.loading {
        background: rgba(96, 165, 250, 0.1);
        border: 1px solid rgba(96, 165, 250, 0.25);
        color: var(--status-info);
      }

      .status-banner.not-found {
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.25);
        color: var(--status-error);
      }

      .status-banner.found {
        background: var(--accent-dim);
        border: 1px solid rgba(124, 92, 252, 0.3);
        color: var(--accent-text);
      }

      /* Section label */
      .section-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted-ui);
        letter-spacing: 1.2px;
        text-transform: uppercase;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .section-label::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* Cards */
      .card {
        background: var(--bg-secondary);
        border: 1px solid rgba(73, 80, 87, 0.85);
        border-radius: var(--radius-md);
        margin-bottom: 8px;
        overflow: hidden;
      }

      .card-header {
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        /* button reset */
        width: 100%;
        background: transparent;
        border: none;
        font-family: 'Inter', sans-serif;
        color: inherit;
        text-align: left;
      }

      .card-header:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .tag-badge {
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .gtm-badge {
        background: var(--accent-dim);
        color: var(--accent-text);
        border: 1px solid rgba(124, 92, 252, 0.3);
      }

      .ga4-badge {
        background: rgba(52, 211, 153, 0.15);
        color: var(--status-success);
        border: 1px solid rgba(52, 211, 153, 0.3);
      }

      .card-title {
        font-size: 12px;
        font-weight: 700;
        flex: 1;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--status-success);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      .card-chevron {
        font-size: 10px;
        color: var(--text-muted);
        transition: transform 0.2s;
      }

      .card-chevron.open {
        transform: rotate(90deg);
      }

      .card-body {
        padding: 10px 12px;
        border-top: 1px solid rgba(73, 80, 87, 0.5);
        display: none;
      }

      .card-body.open {
        display: block;
      }

      .prop-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        font-size: 11px;
      }

      .prop-row:last-child {
        border-bottom: none;
      }

      .prop-key {
        color: var(--text-muted-ui);
        font-size: 10px;
      }

      .prop-val {
        font-size: 10px;
        color: var(--text-primary);
        font-weight: 600;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* DataLayer Events */
      .event-item {
        background: var(--bg-secondary);
        border: 1px solid rgba(73, 80, 87, 0.55);
        border-radius: var(--radius-sm);
        margin-bottom: 6px;
        overflow: hidden;
      }

      .event-header {
        display: flex;
        align-items: center;
        padding: 7px 10px;
        gap: 8px;
        cursor: pointer;
        /* button reset */
        width: 100%;
        background: transparent;
        border: none;
        font-family: 'Inter', sans-serif;
        color: inherit;
        text-align: left;
      }

      .event-header:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .event-index {
        font-size: 9px;
        color: var(--text-muted-ui);
        min-width: 20px;
      }

      .event-name {
        font-size: 11px;
        font-weight: 600;
        flex: 1;
      }

      .event-body {
        padding: 0 10px 8px;
        display: none;
      }

      .event-body.open {
        display: block;
      }

      .event-json {
        background: rgba(0, 0, 0, 0.25);
        border-radius: 4px;
        padding: 8px;
        font-family: monospace;
        font-size: 10px;
        color: #aef;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 120px;
        overflow-y: auto;
      }

      /* Network hits */
      .hit-item {
        background: var(--bg-secondary);
        border: 1px solid rgba(73, 80, 87, 0.55);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        margin-bottom: 6px;
      }

      .hit-type {
        font-size: 10px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .hit-type.gtm-type {
        color: var(--accent-text);
      }
      .hit-type.ga4-type {
        color: var(--status-success);
      }
      .hit-type.ua-type {
        color: var(--status-warning);
      }

      .hit-meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .hit-chip {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
        padding: 2px 6px;
        font-size: 9px;
        color: var(--text-muted-ui);
      }

      .hit-time {
        margin-left: auto;
        font-size: 9px;
        color: var(--text-muted-ui);
      }

      .empty-state {
        text-align: center;
        padding: 30px 20px;
        color: var(--text-muted-ui);
      }

      .empty-state .icon {
        font-size: 28px;
        margin-bottom: 8px;
      }
      .empty-state p {
        font-size: 12px;
      }

      .clear-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted-ui);
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 9px;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: all 0.2s;
      }

      .clear-btn:hover {
        border-color: var(--status-error);
        color: var(--status-error);
      }

      /* Footer */
      .footer {
        background: var(--bg-secondary);
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .footer-left {
        font-size: 10px;
        font-weight: 400;
        color: var(--text-muted-ui);
        letter-spacing: 0.2px;
      }

      .refresh-btn {
        background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
        border: none;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        padding: 7px 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .refresh-btn:hover {
        opacity: 0.85;
      }

      .refresh-btn.spinning {
        opacity: 0.6;
        pointer-events: none;
      }

      /* Focus indicators — Phase 1 accessibility */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .tab:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -2px;
      }

      .refresh-btn:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="accent-line" aria-hidden="true"></div>

    <header class="header">
      <div class="header-icon" aria-hidden="true">
        <span>&lt;/&gt;</span>
      </div>
      <div class="header-titles">
        <h1>GTM &amp; QA Assistant</h1>
        <span class="header-version">v2.4.1</span>
      </div>
      <div class="header-status-dot" aria-hidden="true"></div>
    </header>

    <div class="divider"></div>

    <div class="url-bar">
      <span class="url-icon" aria-hidden="true">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
      </span>
      <span class="url-text" id="urlBar" aria-label="Current page URL">—</span>
    </div>

    <div class="divider"></div>

    <div class="tab-container">
      <div class="tab-segment" role="tablist" aria-label="Extension sections">
        <button
          class="tab active"
          role="tab"
          id="tab-btn-overview"
          data-tab="overview"
          aria-selected="true"
          aria-controls="tab-overview"
          tabindex="0"
        >
          Overview
          <span class="badge" id="badge-overview" aria-label="0 tags detected">0</span>
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-btn-datalayer"
          data-tab="datalayer"
          aria-selected="false"
          aria-controls="tab-datalayer"
          tabindex="-1"
        >
          DataLayer
          <span class="badge" id="badge-datalayer" aria-label="0 dataLayer events">0</span>
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-btn-network"
          data-tab="network"
          aria-selected="false"
          aria-controls="tab-network"
          tabindex="-1"
        >
          Network
          <span class="badge" id="badge-network" aria-label="0 network hits">0</span>
        </button>
      </div>
    </div>

    <main class="content">
      <!-- OVERVIEW TAB -->
      <div
        class="tab-panel active"
        id="tab-overview"
        role="tabpanel"
        aria-labelledby="tab-btn-overview"
        tabindex="0"
      >
        <div id="statusBanner" class="status-banner loading" role="status" aria-live="polite">
          <span aria-hidden="true">⏳</span> <span>Analyzing page...</span>
        </div>
        <div id="gtmSection" aria-live="polite"></div>
        <div id="ga4Section" aria-live="polite"></div>
      </div>

      <!-- DATALAYER TAB -->
      <div
        class="tab-panel"
        id="tab-datalayer"
        role="tabpanel"
        aria-labelledby="tab-btn-datalayer"
        tabindex="0"
        hidden
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
          "
        >
          <h2 class="section-label" style="flex: 1">dataLayer events</h2>
          <button class="clear-btn" id="clearNetworkBtn" aria-label="Clear dataLayer events">
            Clear
          </button>
        </div>
        <div id="dataLayerList" aria-live="polite"></div>
      </div>

      <!-- NETWORK TAB -->
      <div
        class="tab-panel"
        id="tab-network"
        role="tabpanel"
        aria-labelledby="tab-btn-network"
        tabindex="0"
        hidden
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
          "
        >
          <h2 class="section-label" style="flex: 1">Captured network hits</h2>
          <button class="clear-btn" id="clearHitsBtn" aria-label="Clear network hits">Clear</button>
        </div>
        <div id="networkList" aria-live="polite"></div>
      </div>
    </main>

    <footer class="footer">
      <span class="footer-left" id="lastScan" role="status" aria-live="polite">Last scan: —</span>
      <button class="refresh-btn" id="refreshBtn" aria-label="Refresh analysis">Refresh</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
