<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTM & GA4 Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a25;
      --border: #2a2a3a;
      --gtm-color: #4285f4;
      --ga4-color: #34a853;
      --network-color: #fbbc04;
      --error-color: #ea4335;
      --text: #e8e8f0;
      --text-muted: #7070a0;
      --accent: #4285f4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 420px;
      min-height: 500px;
      max-height: 650px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0a0a1f 0%, #0d0d20 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -20px; left: -20px;
      width: 80px; height: 80px;
      background: radial-gradient(circle, rgba(66,133,244,0.15) 0%, transparent 70%);
    }

    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--gtm-color), var(--ga4-color));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(66,133,244,0.3);
    }

    .header-info h1 {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .header-info p {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
    }

    .refresh-btn {
      margin-left: auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px; height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .refresh-btn:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(66,133,244,0.1);
    }

    .refresh-btn.spinning {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 8px;
    }

    .tab {
      padding: 9px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 5px;
      position: relative;
    }

    .tab:hover { color: var(--text); }

    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .tab .badge {
      background: var(--accent);
      color: white;
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      min-width: 16px;
      text-align: center;
    }

    .tab .badge.green { background: var(--ga4-color); }
    .tab .badge.yellow { background: var(--network-color); color: #000; }
    .tab .badge.red { background: var(--error-color); }

    /* Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* Status Banner */
    .status-banner {
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .status-banner.loading {
      background: rgba(66,133,244,0.08);
      border: 1px solid rgba(66,133,244,0.2);
      color: var(--gtm-color);
    }

    .status-banner.not-found {
      background: rgba(234,67,53,0.08);
      border: 1px solid rgba(234,67,53,0.2);
      color: var(--error-color);
    }

    .status-banner.found {
      background: rgba(52,168,83,0.08);
      border: 1px solid rgba(52,168,83,0.2);
      color: var(--ga4-color);
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .card-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }

    .card-header:hover { background: rgba(255,255,255,0.02); }

    .tag-badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
    }

    .gtm-badge { background: rgba(66,133,244,0.15); color: var(--gtm-color); border: 1px solid rgba(66,133,244,0.3); }
    .ga4-badge { background: rgba(52,168,83,0.15); color: var(--ga4-color); border: 1px solid rgba(52,168,83,0.3); }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--ga4-color);
      box-shadow: 0 0 6px var(--ga4-color);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .card-chevron {
      font-size: 10px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .card-chevron.open { transform: rotate(90deg); }

    .card-body {
      padding: 10px 12px;
      display: none;
    }

    .card-body.open { display: block; }

    .prop-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 11px;
    }

    .prop-row:last-child { border-bottom: none; }

    .prop-key {
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
    }

    .prop-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text);
      font-weight: 600;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* DataLayer Events */
    .event-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
      overflow: hidden;
    }

    .event-header {
      display: flex;
      align-items: center;
      padding: 7px 10px;
      gap: 8px;
      cursor: pointer;
    }

    .event-header:hover { background: rgba(255,255,255,0.02); }

    .event-index {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      min-width: 20px;
    }

    .event-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      flex: 1;
    }

    .event-body {
      padding: 0 10px 8px;
      display: none;
    }

    .event-body.open { display: block; }

    .event-json {
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      padding: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #aef;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 120px;
      overflow-y: auto;
    }

    /* Network hits */
    .hit-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }

    .hit-type {
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 4px;
    }

    .hit-type.gtm-type { color: var(--gtm-color); }
    .hit-type.ga4-type { color: var(--ga4-color); }
    .hit-type.ua-type { color: var(--network-color); }

    .hit-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hit-chip {
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }

    .hit-time {
      margin-left: auto;
      font-size: 9px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon { font-size: 28px; margin-bottom: 8px; }
    .empty-state p { font-size: 12px; }

    /* Section label */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 9px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      border-color: var(--error-color);
      color: var(--error-color);
    }

    /* Tab panels */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* URL bar */
    .url-bar {
      background: var(--surface2);
      border-top: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">🏷️</div>
  <div class="header-info">
    <h1>GTM & GA4 ASSISTANT</h1>
    <p id="headerUrl">Cargando...</p>
  </div>
  <button class="refresh-btn" id="refreshBtn" title="Refrescar">↻</button>
</div>

<div class="tabs">
  <div class="tab active" data-tab="overview">
    Resumen
    <span class="badge" id="badge-overview">0</span>
  </div>
  <div class="tab" data-tab="datalayer">
    DataLayer
    <span class="badge green" id="badge-datalayer">0</span>
  </div>
  <div class="tab" data-tab="network">
    Network
    <span class="badge yellow" id="badge-network">0</span>
  </div>
</div>

<div class="content">
  <!-- OVERVIEW TAB -->
  <div class="tab-panel active" id="tab-overview">
    <div id="statusBanner" class="status-banner loading">
      <span>⏳</span> <span>Analizando página...</span>
    </div>

    <div id="gtmSection"></div>
    <div id="ga4Section"></div>
  </div>

  <!-- DATALAYER TAB -->
  <div class="tab-panel" id="tab-datalayer">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="section-label" style="flex:1">Eventos del dataLayer</div>
      <button class="clear-btn" id="clearNetworkBtn">Limpiar</button>
    </div>
    <div id="dataLayerList"></div>
  </div>

  <!-- NETWORK TAB -->
  <div class="tab-panel" id="tab-network">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="section-label" style="flex:1">Hits de red capturados</div>
      <button class="clear-btn" id="clearHitsBtn">Limpiar</button>
    </div>
    <div id="networkList"></div>
  </div>
</div>

<div class="url-bar" id="urlBar">—</div>

<script src="popup.js"></script>
</body>
</html>
