<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTM & QA Assistant</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ui.css" />
    <style>
      /* Popup-specific sizing (shared styles live in ui.css) */
      body {
        width: 340px;
        height: 540px;
      }

      /* Toggle to open/close this panel as the docked Firefox sidebar (popup only) */
      .sidebar-toggle {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 9px 16px;
        background: var(--accent-dim);
        border: none;
        border-top: 1px solid rgba(124, 92, 252, 0.25);
        border-bottom: 1px solid rgba(124, 92, 252, 0.25);
        color: var(--accent-text);
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s;
      }

      .sidebar-toggle:hover {
        background: rgba(124, 92, 252, 0.22);
      }

      .sidebar-toggle svg {
        flex-shrink: 0;
      }

      .sidebar-toggle-label {
        flex: 1;
      }

      .sidebar-toggle:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -2px;
      }

      /* Visual switch track + knob (state driven by aria-checked on the button) */
      .sidebar-switch {
        position: relative;
        width: 32px;
        height: 18px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
        transition: background 0.18s;
      }

      .sidebar-toggle[aria-checked='true'] .sidebar-switch {
        background: var(--accent);
      }

      .sidebar-switch-knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.18s;
      }

      .sidebar-toggle[aria-checked='true'] .sidebar-switch-knob {
        transform: translateX(14px);
      }
    </style>
  </head>
  <body>
    <div class="accent-line" aria-hidden="true"></div>

    <header class="header">
      <div class="header-icon" aria-hidden="true">
        <img src="icons/icon48.png" alt="" width="28" height="28" />
      </div>
      <div class="header-titles">
        <h1>GTM &amp; QA Assistant</h1>
        <span class="header-version">v1.2.0</span>
      </div>
      <div class="header-status-dot" aria-hidden="true"></div>
    </header>

    <div class="divider"></div>

    <div class="url-bar">
      <span class="url-icon" aria-hidden="true">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
      </span>
      <span class="url-text" id="urlBar" aria-label="Current page URL">—</span>
    </div>

    <div class="divider"></div>

    <button
      class="sidebar-toggle"
      id="sidebarToggle"
      type="button"
      role="switch"
      aria-checked="false"
      aria-label="Toggle the GTM &amp; GA4 sidebar panel"
      title="Open or close this panel in the Firefox sidebar"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <line x1="9" y1="3" x2="9" y2="21" />
      </svg>
      <span class="sidebar-toggle-label" id="sidebarToggleLabel">Open in sidebar</span>
      <span class="sidebar-switch" aria-hidden="true">
        <span class="sidebar-switch-knob"></span>
      </span>
    </button>

    <div class="tab-container">
      <div class="tab-segment" role="tablist" aria-label="Extension sections">
        <button
          class="tab active"
          role="tab"
          id="tab-btn-overview"
          data-tab="overview"
          aria-selected="true"
          aria-controls="tab-overview"
          tabindex="0"
        >
          Overview
          <span class="badge" id="badge-overview" aria-label="0 tags detected">0</span>
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-btn-datalayer"
          data-tab="datalayer"
          aria-selected="false"
          aria-controls="tab-datalayer"
          tabindex="-1"
        >
          DataLayer
          <span class="badge" id="badge-datalayer" aria-label="0 dataLayer events">0</span>
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-btn-network"
          data-tab="network"
          aria-selected="false"
          aria-controls="tab-network"
          tabindex="-1"
        >
          Network
          <span class="badge" id="badge-network" aria-label="0 network hits">0</span>
        </button>
      </div>
    </div>

    <main class="content">
      <!-- OVERVIEW TAB -->
      <div
        class="tab-panel active"
        id="tab-overview"
        role="tabpanel"
        aria-labelledby="tab-btn-overview"
        tabindex="0"
      >
        <div id="statusBanner" class="status-banner loading" role="status" aria-live="polite">
          <span aria-hidden="true">⏳</span> <span>Analyzing page...</span>
        </div>
        <div id="gtmSection" aria-live="polite"></div>
        <div id="ga4Section" aria-live="polite"></div>
      </div>

      <!-- DATALAYER TAB -->
      <div
        class="tab-panel"
        id="tab-datalayer"
        role="tabpanel"
        aria-labelledby="tab-btn-datalayer"
        tabindex="0"
        hidden
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
          "
        >
          <h2 class="section-label" style="flex: 1">dataLayer events</h2>
          <button class="clear-btn" id="clearNetworkBtn" aria-label="Clear dataLayer events">
            Clear
          </button>
        </div>
        <button
          class="preserve-toggle"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="Keep captured data when the page reloads"
          title="Keep captured hits and dataLayer events when the page reloads"
        >
          <span class="preserve-toggle-icon" aria-hidden="true">🔄</span>
          <span class="preserve-toggle-text">
            <span class="preserve-toggle-title">Keep data on reload</span>
            <span class="preserve-toggle-sub"
              >Don't clear hits &amp; dataLayer when the page refreshes</span
            >
          </span>
          <span class="preserve-switch" aria-hidden="true">
            <span class="preserve-switch-knob"></span>
          </span>
        </button>
        <div id="dataLayerList" aria-live="polite"></div>
      </div>

      <!-- NETWORK TAB -->
      <div
        class="tab-panel"
        id="tab-network"
        role="tabpanel"
        aria-labelledby="tab-btn-network"
        tabindex="0"
        hidden
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
          "
        >
          <h2 class="section-label" style="flex: 1">Captured network hits</h2>
          <button class="clear-btn" id="clearHitsBtn" aria-label="Clear network hits">Clear</button>
        </div>
        <button
          class="preserve-toggle"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="Keep captured data when the page reloads"
          title="Keep captured hits and dataLayer events when the page reloads"
        >
          <span class="preserve-toggle-icon" aria-hidden="true">🔄</span>
          <span class="preserve-toggle-text">
            <span class="preserve-toggle-title">Keep data on reload</span>
            <span class="preserve-toggle-sub"
              >Don't clear hits &amp; dataLayer when the page refreshes</span
            >
          </span>
          <span class="preserve-switch" aria-hidden="true">
            <span class="preserve-switch-knob"></span>
          </span>
        </button>
        <div id="networkList" aria-live="polite"></div>
      </div>
    </main>

    <footer class="footer">
      <span class="footer-left" id="lastScan" role="status" aria-live="polite">Last scan: —</span>
      <button class="refresh-btn" id="refreshBtn" aria-label="Refresh analysis">Refresh</button>
    </footer>

    <script src="ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
